name: CI
# Phase 4 final-audit verification
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seethapaati_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d seethapaati_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seethapaati_dev?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low || true
      - run: npm run build --workspace=@seethapaati/contracts
      - run: npm run prisma:generate --workspace=@seethapaati/api
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck --workspace=@seethapaati/api
      - run: npm run lint --workspace=@seethapaati/api
      - run: npm test --workspace=@seethapaati/api -- --runInBand
      - run: npm run build --workspace=@seethapaati/api
      - run: npm run build --workspace=@seethapaati/web
